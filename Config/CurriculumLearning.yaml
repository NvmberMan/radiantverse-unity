behaviors:
  MoveToGoal:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.01
        gamma: 0.99
      gail:
        strength: 0.6
        demo_path: Demo/Demo02.demo
    behavioral_cloning:
      strength: 0.6
      demo_path: Demo/Demo02.demo
    max_steps: 1500000
    time_horizon: 64
    summary_freq: 10000