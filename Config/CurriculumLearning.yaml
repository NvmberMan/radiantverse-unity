behaviors:
  MoveToGoal:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true # Diaktifkan agar sensor raycast/posisi lebih stabil
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        strength: 0.5 # Kekuatan pengaruh demo terhadap "gaya" lari AI
        gamma: 0.99
        demo_path: Demo/Demo02.demo
      curiosity: # Tetap gunakan curiosity agar AI mau eksplorasi jalan pintas
        strength: 0.02
        gamma: 0.99
        learning_rate: 0.0003
    behavioral_cloning:
      strength: 0.5 # Memberitahu AI: "Lakukan apa yang dilakukan manusia di demo"
      demo_path: Demo/Demo02.demo
      steps: 100000 # BC biasanya dominan di awal pelatihan saja
    max_steps: 5000000
    time_horizon: 128 # Ditingkatkan agar AI bisa melihat korelasi aksi yang lebih panjang
    summary_freq: 5000